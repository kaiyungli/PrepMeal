name: Shopping List Regression (PR #105)
on:
  pull_request:
    paths:
      - 'tests/shoppingList.v25.regression.test.ts'
      - 'src/lib/shoppingList.ts'
      - 'src/pages/api/shopping-list.ts'
      - 'src/features/generate/services/fetchGeneratedPlanShoppingList.ts'
      - 'src/features/generate/hooks/useGeneratedShoppingList.ts'
      - 'src/features/generate/hooks/useGenerateActions.ts'
      - 'src/features/generate/hooks/useGeneratePageController.ts'
      - 'src/lib/ingredientNormalizer.ts'
      - '.github/workflows/shopping-list-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shopping-list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run shopping list regression test
        run: npx --no-install vitest run tests/shoppingList.v25.regression.test.ts --config vitest.config.ts
