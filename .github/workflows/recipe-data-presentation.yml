name: Recipe data presentation
on:
  pull_request:
    paths:
      - 'src/features/recipes/**'
      - 'src/components/RecipeDetail*'
      - 'src/components/RecipeProvenance.tsx'
      - 'src/lib/recipeServings.ts'
      - 'src/lib/shoppingListData.js'
      - 'src/lib/quantityFormatter.ts'
      - 'src/pages/api/shopping-list.ts'
      - 'tests/recipeProvenance.test.ts'
      - 'tests/recipeDetail*.test.*'
      - 'tests/shoppingList*.test.ts'
      - 'vitest*.ts'
      - 'package*.json'
      - '.github/workflows/recipe-data-presentation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:all
      - run: npx --no-install tsc --noEmit --incremental false
